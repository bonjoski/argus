name: agent_stealer_credential_ssh_pattern
version: 1.0
description: "OX.Radar High (80/100): Flags unconfined agent frameworks (e.g. kiss-agent-framework) or scripts combining cloud/LLM env credential reads with SSH authorized_keys modification or tunneling hosts. Remediation: run confined via 'airlock run --profile untrusted-agent --allow-egress api.anthropic.com -- <cmd>'."
severity: HIGH
window: 60s
action: alert
causal_sequence:
  - step: agent_stealer_risk_detection
    events:
      - layer: supply_chain
        action: package_install|resolve_package|dependency_add|pre_check
        package_name_matches: "^kiss[-_.]agent[-_.]framework$"
      - layer: supply_chain
        action: package_install|resolve_package|dependency_add|pre_check|preinstall|postinstall|install_hook|lifecycle_script|run_script
        hook_matches: "(?:ANTHROPIC_API_KEY|OPENAI_API_KEY|AWS_SECRET_ACCESS_KEY|AWS_ACCESS_KEY_ID|GEMINI_API_KEY|GOOGLE_API_KEY|GITHUB_TOKEN)[\\s\\S]*(?:authorized_keys|ngrok|trycloudflare|serveo|localtunnel)|(?:authorized_keys|ngrok|trycloudflare|serveo|localtunnel)[\\s\\S]*(?:ANTHROPIC_API_KEY|OPENAI_API_KEY|AWS_SECRET_ACCESS_KEY|AWS_ACCESS_KEY_ID|GEMINI_API_KEY|GOOGLE_API_KEY|GITHUB_TOKEN)"
      - layer: l7_mcp
        action: preinstall|postinstall|install_hook|lifecycle_script|run_script|exec|bash|shell
        hook_matches: "(?:ANTHROPIC_API_KEY|OPENAI_API_KEY|AWS_SECRET_ACCESS_KEY|AWS_ACCESS_KEY_ID|GEMINI_API_KEY|GOOGLE_API_KEY|GITHUB_TOKEN)[\\s\\S]*(?:authorized_keys|ngrok|trycloudflare|serveo|localtunnel)|(?:authorized_keys|ngrok|trycloudflare|serveo|localtunnel)[\\s\\S]*(?:ANTHROPIC_API_KEY|OPENAI_API_KEY|AWS_SECRET_ACCESS_KEY|AWS_ACCESS_KEY_ID|GEMINI_API_KEY|GOOGLE_API_KEY|GITHUB_TOKEN)"
