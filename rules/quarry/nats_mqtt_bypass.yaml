name: nats_mqtt_bypass
version: 1.0
description: "GHSA-4g68-3pwx-5vfj: Intercept NATS Server MQTT subscribe permission bypass exposing QoS 2 metadata"
severity: MEDIUM
window: 60s
action: kill
causal_sequence:
  - step: vulnerable_package_resolution
    events:
      - layer: supply_chain
        action: package_install|resolve_package|dependency_add|pre_check
        package_name_matches: "github\\.com/nats-io/nats-server(/v2)?"
        vulnerable_versions: "<2.10.26"
