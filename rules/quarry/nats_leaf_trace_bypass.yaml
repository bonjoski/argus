name: nats_leaf_trace_bypass
version: 1.0
description: "GHSA-p3j5-5hrq-p75h (CVE-2026-58254): Intercept vulnerable nats-server versions where leaf node connections bypass Nats-Trace-Dest permission checks"
severity: MEDIUM
window: 60s
action: kill
causal_sequence:
  - step: vulnerable_package_resolution
    events:
      - layer: supply_chain
        action: package_install|resolve_package|dependency_add|pre_check
        package_name_matches: "github\\.com/nats-io/nats-server(/v2)?"
        vulnerable_versions: "<2.12.8 || >=2.14.0-RC.1, <2.14.3"
