# GoReleaser configuration for Argus (vetpkg)
version: 2

project_name: argus

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: argus
    main: ./cmd/argus
    binary: argus
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X bonjoski/argus/internal/cli.Version={{ .Version }}
      - -X bonjoski/argus/internal/cli.GitCommit={{ .Commit }}
      - -X bonjoski/argus/internal/cli.BuildDate={{ .Date }}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - PROJECT_PLAN.md
      - docs/*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  - id: cosign
    artifacts: checksum
    cmd: cosign
    args:
      - "sign-blob"
      - "--yes"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "merge conflict"
